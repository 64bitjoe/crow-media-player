# Keeps this fork's main = upstream/main + the fork's patch commits + one generated "Build (yt)" commit.
# Daily (and on demand): replays the patches on the newest upstream, rebuilds www/ from source/, pushes, and
# releases <upstream version>-yt.<n> so HACS offers the update. On a conflict nothing is pushed; an issue
# lists the files instead. See SYNC.md.
name: Sync upstream

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: jamesmcginnis/crow-media-player
  BUILD_SUBJECT: Build (yt)
  LABEL: upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # a token with Workflows write: GITHUB_TOKEN can't push commits that touch .github/workflows
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync, build, push and release
        env:
          GH_TOKEN: ${{ github.token }}
          # gh would otherwise pick the "upstream" remote; every gh call here is about this fork
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          T="$RUNNER_TEMP"

          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --no-tags upstream main
          OLD=$(git rev-parse HEAD)
          UP=$(git rev-parse upstream/main)
          BASE=$(git merge-base HEAD "$UP")
          git log --format='- %h %s' "$BASE..$UP" > "$T/upstream.md"

          # the fork's own commits, oldest first, without the generated build commits
          git log --reverse --no-merges --format='%H%x09%s' "$BASE..HEAD" \
            | awk -F'\t' -v b="$BUILD_SUBJECT" '$2 != b { print $1 }' > "$T/patches"

          VER=$(git show "$UP:custom_components/crow_media_player/manifest.json" | jq -r .version)
          gh release view "v$VER" -R "$UPSTREAM" --json body -q .body > "$T/notes-up.md" 2>/dev/null || : > "$T/notes-up.md"

          # replay the patches on upstream (--ff keeps them as they are while upstream hasn't moved)
          git reset -q --hard "$UP"
          for c in $(cat "$T/patches"); do
            if git cherry-pick --ff "$c" > /dev/null 2>&1; then continue; fi
            if [ -z "$(git diff --name-only --diff-filter=U)" ] && git diff --cached --quiet; then
              git cherry-pick --skip   # upstream already has this change
              continue
            fi
            FILES=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
            WHAT=$(git log -1 --format='%h %s' "$c")
            git cherry-pick --abort
            git reset -q --hard "$OLD"
            TITLE="Upstream sync conflict at ${UP:0:7}"
            gh label create "$LABEL" --color D93F0B --description 'Automatic upstream sync' > /dev/null 2>&1 || true
            if [ "$(gh issue list --state open --label "$LABEL" --search "${UP:0:7} in:title" --json number -q length)" != "0" ]; then
              echo "Conflict already reported in an open issue; nothing pushed."
              exit 0
            fi
            {
              echo "Upstream has new commits that conflict with this fork's patches, so \`main\` was left as it was and nothing was released."
              echo
              echo "**Conflicting files** (while applying \`$WHAT\`):"
              echo "$FILES"
              echo
              echo "**New upstream commits** (\`${BASE:0:7}..${UP:0:7}\`):"
              cat "$T/upstream.md"
              if [ -s "$T/notes-up.md" ]; then echo; echo "**Upstream release notes (v$VER):**"; echo; cat "$T/notes-up.md"; fi
              echo
              echo "Fix it by hand as described in [SYNC.md](../blob/main/SYNC.md), then close this issue."
            } > "$T/issue.md"
            gh issue create --title "$TITLE" --label "$LABEL" --body-file "$T/issue.md"
            echo "::error::Rebase onto upstream ${UP:0:7} conflicted while applying $WHAT; see the new issue."
            exit 1
          done

          git log --reverse --format='- %h %s' "$UP..HEAD" > "$T/patches.md"

          # the built files are always made here, never carried over: the minified one-line files would conflict
          (cd source && npm install --no-audit --no-fund --no-package-lock && npm run build)
          git add -A custom_components/crow_media_player/www
          git diff --cached --quiet || git commit -q -m "$BUILD_SUBJECT" -m 'Generated by the sync-upstream workflow from source/. Never edit by hand.'

          if git merge-base --is-ancestor "$UP" "$OLD" && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$OLD^{tree}")" ]; then
            if git tag --points-at "$OLD" | grep -q -- '-yt\.'; then
              echo "Up to date with upstream ${UP:0:7}; nothing to do."
              exit 0
            fi
            git reset -q --hard "$OLD"   # published but never released (an earlier run stopped): release it as it is
          else
            git push --force-with-lease="main:$OLD" origin HEAD:main
          fi

          git fetch -q --tags origin
          PREFIX="v$VER-yt."
          N=$(git tag -l "$PREFIX*" | sed "s/^$PREFIX//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          TAG="$PREFIX$(( ${N:-0} + 1 ))"
          {
            echo "[$UPSTREAM](https://github.com/$UPSTREAM) v$VER (\`${UP:0:7}\`) plus this fork's patches."
            echo
            echo '### New from upstream'
            if [ -s "$T/upstream.md" ]; then cat "$T/upstream.md"; else echo 'Nothing new since the last sync.'; fi
            if [ -s "$T/notes-up.md" ]; then echo; echo "### Upstream release notes (v$VER)"; echo; cat "$T/notes-up.md"; fi
            echo
            echo '### Fork patches'
            cat "$T/patches.md"
          } > "$T/release.md"
          gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" --notes-file "$T/release.md" --latest

          # a sync that works again closes the conflict reports
          for n in $(gh issue list --state open --label "$LABEL" --json number -q '.[].number' 2>/dev/null); do
            gh issue close "$n" --comment "Synced cleanly and released $TAG."
          done
